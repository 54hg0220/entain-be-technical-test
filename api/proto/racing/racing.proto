syntax = "proto3";
package racing;

option go_package = "/racing";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

service Racing {
  // ListRaces returns a list of races, optionally filtered and ordered.
  rpc ListRaces(ListRacesRequest) returns (ListRacesResponse) {
    option (google.api.http) = { post: "/v1/list-races", body: "*" };
  }

  // GetRace returns a single race by its ID, or NOT_FOUND if no such race
  // exists. Unlike ListRaces it does not filter on visibility: it is a direct
  // lookup by a caller that already holds the ID, and hiding a race here
  // would make it indistinguishable from one that does not exist.
  rpc GetRace(GetRaceRequest) returns (Race) {
    option (google.api.http) = { get: "/v1/races/{id}" };
  }
}

/* Requests/Responses */

// Request for ListRaces call.
message ListRacesRequest {
  ListRacesRequestFilter filter = 1;
  // Comma separated list of fields to order by, each optionally followed by
  // " asc" or " desc", e.g. "meeting_id, advertised_start_time desc".
  // Supported fields: id, meeting_id, name, number, visible,
  // advertised_start_time. Defaults to "advertised_start_time". Field names
  // are case sensitive, like every other field name in the API; "asc" and
  // "desc" are keywords and are not.
  string order_by = 2;
}

// Response to ListRaces call.
message ListRacesResponse {
  repeated Race races = 1;
}

// Request for GetRace call.
message GetRaceRequest {
  // ID of the race to fetch.
  int64 id = 1;
}

// Filter for listing races.
message ListRacesRequestFilter {
  repeated int64 meeting_ids = 1;
  // When set, only races whose visibility matches are returned. When unset,
  // races are returned regardless of their visibility.
  optional bool visible = 2;
}

/* Resources */

// A race resource.
message Race {
  // ID represents a unique identifier for the race.
  int64 id = 1;
  // MeetingID represents a unique identifier for the races meeting.
  int64 meeting_id = 2;
  // Name is the official name given to the race.
  string name = 3;
  // Number represents the number of the race.
  int64 number = 4;
  // Visible represents whether or not the race is visible.
  bool visible = 5;
  // AdvertisedStartTime is the time the race is advertised to run.
  google.protobuf.Timestamp advertised_start_time = 6;
  // Status is derived from advertised_start_time each time a race is read;
  // it is not stored.
  Status status = 7;

  // Status describes whether a race is still open.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The race's advertised start time is still in the future.
    OPEN = 1;
    // The race's advertised start time has been reached or has passed.
    CLOSED = 2;
  }
}
